<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/" text="" icon="arrow-back"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="sign-up-content" [fullscreen]="true">
  <div class="content-wrapper">

    <!-- Title -->
    <div class="header-section">
      <h1 class="title">Create Account</h1>
      <p class="subtitle">Join FreelanceHub today</p>
    </div>

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="onSignUp()" class="sign-up-form">

      <!-- Full Name -->
      <div class="field-group">
        <label class="field-label">Full Name</label>
        <div class="input-wrapper">
          <ion-input
            type="text"
            placeholder="Enter your full name"
            formControlName="fullName"
            fill="outline"
            class="custom-input"
          ></ion-input>
        </div>
      </div>

      <!-- Email -->
      <div class="field-group">
        <label class="field-label">Email</label>
        <div class="input-wrapper">
          <ion-input
            type="email"
            placeholder="Enter your email"
            formControlName="email"
            fill="outline"
            class="custom-input"
          ></ion-input>
        </div>
      </div>

      <!-- Password -->
      <div class="field-group">
        <label class="field-label">Password</label>
        <div class="input-wrapper">
          <ion-input
            type="password"
            placeholder="Create a password"
            formControlName="password"
            fill="outline"
            class="custom-input"
          ></ion-input>
        </div>
      </div>

      <!-- User Type Selection -->
      <div class="field-group">
        <label class="field-label">I want to</label>
        <ion-grid class="user-type-grid">
          <ion-row>
            <!-- Hire -->
            <ion-col size="6">
              <div
                class="user-type-card"
                [class.selected]="userType === 'hire'"
                (click)="userType = 'hire'"
              >
                <ion-icon name="briefcase-outline" class="type-icon"></ion-icon>
                <p class="type-label">Hire</p>
              </div>
            </ion-col>
            <!-- Work -->
            <ion-col size="6">
              <div
                class="user-type-card"
                [class.selected]="userType === 'work'"
                (click)="userType = 'work'"
              >
                <ion-icon name="ribbon-outline" class="type-icon"></ion-icon>
                <p class="type-label">Work</p>
              </div>
            </ion-col>
          </ion-row>
        </ion-grid>
      </div>

      <!-- Terms & Privacy -->
      <div class="terms-row">
        <ion-checkbox
          formControlName="agreeToTerms"
          class="terms-checkbox"
        ></ion-checkbox>
        <span class="terms-text">
          I agree to the
          <ion-text color="primary">
            <span class="link" (click)="onTermsClick()">Terms of Service</span>
          </ion-text>
          and
          <ion-text color="primary">
            <span class="link" (click)="onPrivacyClick()">Privacy Policy</span>
          </ion-text>
        </span>
      </div>

      <!-- Submit Button -->
      <ion-button
        type="submit"
        expand="block"
        class="submit-btn"
        [disabled]="!agreeToTerms"
      >
        Create Account
      </ion-button>

    </form>

  </div>

  <!-- Footer -->
  <div class="footer-section">
    <p class="footer-text">
      Already have an account?
      <ion-text color="primary">
        <span class="link" (click)="onLogin()">Sign in</span>
      </ion-text>
    </p>
  </div>

</ion-content>
