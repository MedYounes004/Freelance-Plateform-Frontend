<ion-header class="ion-no-border messages-header">
  <ion-toolbar>
    <div class="header-content">
      <div class="header-top-row">
        <div class="header-title">
          <h1>Messages</h1>
          <p>Stay connected with clients</p>
        </div>
        <button type="button" class="new-message-btn" (click)="openRecipients()">
          New message
        </button>
      </div>
      <div class="search-wrapper">
        <ion-searchbar
          placeholder="Search messages..."
          [(ngModel)]="searchQuery"
          (ionInput)="onSearch($event)"
          class="custom-searchbar"
          [debounce]="300">
        </ion-searchbar>
      </div>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="messages-content">
  <div class="status-box" *ngIf="isLoading">Loading messages...</div>

  <div class="status-box error" *ngIf="!isLoading && errorMessage">
    <p>{{ errorMessage }}</p>
    <button type="button" class="retry-btn" (click)="loadConversations()">Retry</button>
  </div>

  <div class="status-box" *ngIf="!isLoading && !errorMessage && filteredConversations.length === 0">
    No messages found.
  </div>

  <ion-list lines="none" class="conversations-list">
    <ion-item
      *ngFor="let conversation of filteredConversations"
      button
      detail="false"
      (click)="onMessageClick(conversation)"
      class="conversation-item">

      <div slot="start" class="avatar-wrapper">
        <ion-avatar class="conversation-avatar">
          <img
            [src]="avatarUrl(conversation.name, '4f46e5')"
            [alt]="conversation.name"
          />
        </ion-avatar>
        <span *ngIf="conversation.online" class="online-indicator"></span>
      </div>

      <ion-label class="conversation-label">
        <div class="conversation-header">
          <h2 class="conversation-name">{{ conversation.name }}</h2>
          <span class="conversation-time">{{ conversation.time }}</span>
        </div>
        <p class="conversation-message">{{ conversation.message }}</p>
      </ion-label>

      <div slot="end" *ngIf="conversation.unread > 0" class="unread-badge">
        <ion-badge color="primary">{{ conversation.unread }}</ion-badge>
      </div>

    </ion-item>
  </ion-list>
</ion-content>

<app-bottom-navigation
  [currentTab]="activeTab"
  (tabChange)="onTabChange($event)"
></app-bottom-navigation>


<app-login-required-modal
  [isOpen]="showLoginModal"
  [actionDescription]="'messaging'"
  (close)="onContinueBrowsing()"
  (login)="onGoToLogin()"
  (signUp)="onGoToSignUp()"
></app-login-required-modal>
