<div class="ion-page">
  <ion-header>
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-back-button defaultHref="/profile"></ion-back-button>
      </ion-buttons>
      <ion-title>Resume / CV</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content class="ion-padding" [fullscreen]="true">

    <!-- Upload New CV -->
    <div class="section-card">
      <h2 class="section-title">Upload New Resume</h2>
      <button class="upload-zone" (click)="onUpload()">
        <div class="upload-icon-wrap">
          <ion-icon name="cloud-upload"></ion-icon>
        </div>
        <div class="upload-text">
          <p class="upload-main">Click to upload or drag and drop</p>
          <p class="upload-sub">PDF, DOC, DOCX (Max 5MB)</p>
        </div>
      </button>
    </div>

    <!-- Uploaded CVs -->
    <div class="section-card">
      <div class="section-header">
        <h2 class="section-title">Your Resumes</h2>
        <span class="file-count">{{ cvList.length }} files</span>
      </div>

      <div class="cv-list">
        <div *ngFor="let cv of cvList" class="cv-item">
          <div class="cv-info-row">
            <div class="cv-icon-wrap">
              <ion-icon name="document-text"></ion-icon>
            </div>
            <div class="cv-details">
              <div class="cv-name-row">
                <p class="cv-name">{{ cv.name }}</p>
                <span class="primary-badge" *ngIf="cv.isPrimary">Primary</span>
              </div>
              <p class="cv-meta">{{ cv.size }} • Uploaded {{ cv.uploadDate }}</p>
            </div>
          </div>

          <div class="cv-actions">
            <button class="action-btn download-btn" (click)="onDownload(cv)">
              <ion-icon name="download"></ion-icon>
              Download
            </button>
            <button
              class="action-btn primary-btn"
              *ngIf="!cv.isPrimary"
              (click)="onSetPrimary(cv)"
            >
              Set as Primary
            </button>
            <button class="action-btn delete-btn" (click)="onDelete(cv)">
              <ion-icon name="trash"></ion-icon>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Tips -->
    <div class="tips-card">
      <h3 class="tips-title">
        <span class="tips-emoji">💡</span>
        Tips for a Great Resume
      </h3>
      <ul class="tips-list">
        <li *ngFor="let tip of tips" class="tip-item">
          <span class="tip-dot">•</span>
          <span>{{ tip }}</span>
        </li>
      </ul>
    </div>

    <!-- Privacy Notice -->
    <div class="privacy-card">
      <p>Your resume is visible to clients when you apply to projects or when they view your profile.</p>
    </div>

  </ion-content>
</div>
