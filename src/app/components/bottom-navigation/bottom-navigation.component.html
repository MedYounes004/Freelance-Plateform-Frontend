<ion-tab-bar slot="bottom">
  <ion-tab-button
    *ngFor="let tab of tabs"
    [tab]="tab.id"
    [selected]="currentTab === tab.id"
    (click)="onTabChange(tab.id)"
  >
    <ion-icon
      [name]="currentTab === tab.id ? tab.icon : tab.icon + '-outline'"
    ></ion-icon>
    <ion-label>{{ tab.label }}</ion-label>
  </ion-tab-button>
</ion-tab-bar>
