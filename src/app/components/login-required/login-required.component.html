<div class="modal-overlay" *ngIf="isOpen" (click)="onClose()">
  <div class="modal-box" (click)="$event.stopPropagation()">

    <!-- Close Button -->
    <button class="close-btn" (click)="onClose()">
      <ion-icon name="close-outline"></ion-icon>
    </button>

    <!-- Icon -->
    <div class="icon-wrap">
      <div class="icon-circle">
        <ion-icon name="lock-closed-outline" class="lock-icon"></ion-icon>
      </div>
    </div>

    <!-- Content -->
    <div class="modal-content">
      <h2>Sign In Required</h2>
      <p>To access {{ actionDescription }}, you need to be signed in to your account.</p>
    </div>

    <!-- Benefits -->
    <div class="benefits-box">
      <p class="benefits-title">With an account, you can:</p>
      <div class="benefits-list">
        <div class="benefit-item">
          <span class="dot"></span>
          <span>Message freelancers directly</span>
        </div>
        <div class="benefit-item">
          <span class="dot"></span>
          <span>Submit proposals and hire talent</span>
        </div>
        <div class="benefit-item">
          <span class="dot"></span>
          <span>Save favorites and track projects</span>
        </div>
        <div class="benefit-item">
          <span class="dot"></span>
          <span>Access your profile and earnings</span>
        </div>
      </div>
    </div>

    <!-- Buttons -->
    <div class="btn-group">
      <button class="btn-primary" (click)="onLogin()">
        <ion-icon name="log-in-outline"></ion-icon>
        Sign In
      </button>
      <button class="btn-outline" (click)="onSignUp()">
        <ion-icon name="person-add-outline"></ion-icon>
        Create Account
      </button>
      <button class="btn-ghost" (click)="onClose()">
        Continue Browsing
      </button>
    </div>

  </div>
</div>
